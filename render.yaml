services:
  - type: web
    name: webore
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@webore.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BASE_URL
        value: https://webore-studio.onrender.com

databases:
  - name: webore-db
    plan: free
    databaseName: webore
